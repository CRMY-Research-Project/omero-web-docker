---
name: Build

on: 
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build
        run: ./build.sh
  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    env:
      name: openmicroscopy/omero-web
    steps:
      - name: Get other tags
        id: gettags
        uses: jupyterhub/action-major-minor-tag-calculator@v2.0.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          prefix: "${{ env.name}}:"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.name }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          tags: ${{ join(fromJson(steps.gettags.outputs.tags)) }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
  uploadstandalone:
      needs: upload
      if: startsWith(github.ref, 'refs/tags')
      runs-on: ubuntu-latest
      env:
        name: openmicroscopy/omero-web-standalone
        nameParent: openmicroscopy/omero-web:latest
        folder: standalone
      steps:
        - uses: actions/checkout@v2
        - name: Get other tags
          id: gettags
          uses: jupyterhub/action-major-minor-tag-calculator@v2.0.0
          with:
            githubToken: ${{ secrets.GITHUB_TOKEN }}
            prefix: "${{ env.name }}:"
        - name: Login to DockerHub
          uses: docker/login-action@v1
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push to Docker Hub
          uses: docker/build-push-action@v2
          with:
            build-args: |
              "PARENT_IMAGE=${{ env.nameParent }}"
            context: ${{ env.folder }}
            tags: ${{ join(fromJson(steps.gettags.outputs.tags)) }}
            push: true
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Syntax check plugins
        run: |
          python -m py_compile standalone/omero-webimport/omero_webimport/*.py
          python -m py_compile standalone/omero-download-gate/omero_download_gate/*.py
      - name: Download-gate store tests
        run: python -m pytest tests/ -q
        working-directory: standalone/omero-download-gate
      # pure modules only (batch, jobs, filenames); views need OMERO.web
      - name: Web-import tests
        run: python -m pytest tests/ -q
        working-directory: standalone/omero-webimport
