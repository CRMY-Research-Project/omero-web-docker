<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Upload slides &middot; OMERO Web Import</title>
        <!-- No external CDNs: OS font stacks from the portal design system
             (docs/design-system.md), inline SVG, framework-free script. -->
        <link rel="stylesheet" type="text/css" href="{% static 'omero_webimport/css/webimport.css' %}">
    </head>
    <body>
        {% csrf_token %}

        <!-- Endpoint URLs as data (application/json is not executable; CSP-safe).
             webimport.js reads these by id and JSON.parse()s the textContent. -->
        <script id="webimport-config" type="application/json">{
          "datasets": "{% url 'omero_webimport_datasets' %}",
          "begin": "{% url 'omero_webimport_begin' %}",
          "chunk": "{% url 'omero_webimport_chunk' %}",
          "complete": "{% url 'omero_webimport_complete' %}",
          "webclient": "{% url 'webindex' %}"
        }</script>

        <main class="page">
            <header class="masthead">
                <p class="eyebrow">Web import</p>
                <h1>Upload slides</h1>
                <p class="lede">Send whole-slide images straight to OMERO. Large files travel in
                    resumable chunks, and every file becomes its own image.</p>
            </header>

            <section class="tray" aria-label="Files to import">
                <div id="drop-zone" class="drop-zone" role="button" tabindex="0"
                     aria-describedby="drop-help">
                    <svg class="drop-glyph" viewBox="0 0 64 40" aria-hidden="true">
                        <rect x="2" y="6" width="60" height="28" rx="3"/>
                        <rect x="8" y="12" width="14" height="16" rx="1.5" class="drop-label"/>
                        <path d="M40 27V13M34 19l6-6 6 6"/>
                    </svg>
                    <p class="drop-title">Drop slides here</p>
                    <p id="drop-help" class="drop-help">or <span class="drop-browse">browse your files</span>
                        &mdash; SVS, NDPI, SCN, TIFF, OME-TIFF and other Bio-Formats types</p>
                    <input type="file" id="file-input" multiple hidden>
                </div>

                <div id="batch" class="batch" hidden>
                    <div class="batch-head">
                        <span class="section-label">This batch</span>
                        <span id="batch-summary" class="batch-summary" aria-live="polite"></span>
                    </div>
                    <div class="meter" aria-hidden="true"><span id="batch-meter"></span></div>
                    <ol id="file-list" class="file-list"></ol>
                </div>

                <div class="controls">
                    <div class="target">
                        <label for="dataset-target" class="section-label">Import into dataset</label>
                        <select id="dataset-target">
                            <option value="">Unassigned (no dataset)</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button id="retry-btn" class="btn btn-secondary" type="button" hidden>Retry failed files</button>
                        <button id="import-btn" class="btn btn-primary" type="button" disabled>Import</button>
                    </div>
                </div>
                <div id="notice" class="notice" role="status" hidden></div>
            </section>
        </main>

        <script src="{% static 'omero_webimport/js/webimport.js' %}"></script>
    </body>
</html>
